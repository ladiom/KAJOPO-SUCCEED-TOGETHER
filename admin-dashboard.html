            background-color: var(--bg-tertiary) !important;

        .text-gray-700 {

        <!-- Main Content -->

                        <h2 class="text-2xl font-bold text-gray-900 mb-4">Loading Dashboard...</h2>

    <script>
        // Use Supabase configuration from supabase-config.js
        
        let supabase = null;
        let currentView = 'applications';
        
        // Authentication check
        function checkAdminAuth() {
            // Wait for unified auth to initialize
            if (typeof window.unifiedAuth === 'undefined') {
                console.log('Unified auth not loaded, waiting...');
                setTimeout(() => {
                    checkAdminAuth();
                }, 500);
                return false;
            }
            
            // Check if Supabase is ready
            if (!window.unifiedAuth.isSupabaseReady()) {
                console.log('Supabase not ready, waiting...');
                setTimeout(() => {
                    checkAdminAuth();
                }, 500);
                return false;
            }
            
            // Use unified auth system
            const currentUser = window.unifiedAuth.getCurrentUser();
            const userIsAuthenticated = window.unifiedAuth.isAuthenticated();
            
            console.log('Admin Dashboard - Authentication check:', { currentUser, userIsAuthenticated });
            
            if (!userIsAuthenticated || !currentUser) {
                console.log('No user found, redirecting to admin login');
                window.location.href = 'admin-login.html';
                return false;
            }
            
            const isAdmin = currentUser.accountType === 'admin' || currentUser.isAdmin || currentUser.role === 'admin';
            if (!isAdmin) {
                console.log('User is not admin, redirecting to admin login');
                alert('Access denied. Admin privileges required.');
                window.location.href = 'admin-login.html';
                return false;
            }
            
            return true;
        }
        
        // Initialize Supabase
        async function initializeSupabase() {
            try {
                console.log('Initializing Supabase...');
                
                // Wait for script to load
                await new Promise(resolve => setTimeout(resolve, 500));
                
                // Use the existing Supabase client from supabase-config.js
                if (window.supabaseClient) {
                    supabase = window.supabaseClient;
                    console.log('✅ Using existing Supabase client from supabase-config.js');
                } else if (typeof window.supabase !== 'undefined' && window.supabase.createClient) {
                    supabase = window.supabase.createClient(window.supabaseConfig.url, window.supabaseConfig.anonKey);
                    console.log('✅ Supabase client created successfully');
                } else if (typeof window.SupabaseClient === 'function') {
                    supabase = new window.SupabaseClient(window.supabaseConfig.url, window.supabaseConfig.anonKey);
                    console.log('✅ Supabase client created using SupabaseClient constructor');
                } else {
                    throw new Error('Supabase not available');
                }
                
                return true;
            } catch (error) {
                console.error('❌ Error initializing Supabase:', error);
                return false;
            }
        }
        
        // Load applications data
        async function loadApplicationsData() {
            try {
                console.log('Loading applications data...');
                
                const { data: applications, error } = await supabase
                    .from('applications')
                    .select('*')
                    .order('created_at', { ascending: false });
                
                if (error) {
                    throw new Error(error.message);
                }
                
                const apps = applications || [];
                console.log(`Found ${apps.length} applications`);
                
                // Store in global variables
                allApplications = apps;
                filteredApplications = [...apps];
                
                // Calculate stats
                const totalApplications = apps.length;
                const pendingApplications = apps.filter(app => app.status === 'pending').length;
                const approvedApplications = apps.filter(app => app.status === 'approved').length;
                const rejectedApplications = apps.filter(app => app.status === 'rejected').length;
                
                const oneWeekAgo = new Date();
                oneWeekAgo.setDate(oneWeekAgo.getDate() - 7);
                const weeklyApplications = apps.filter(app => {
                    const appDate = new Date(app.created_at);
                    return appDate >= oneWeekAgo;
                }).length;
                
                // Update stats cards
                document.getElementById('total-applications').textContent = totalApplications;
                document.getElementById('pending-applications').textContent = pendingApplications;
                document.getElementById('approved-applications').textContent = approvedApplications;
                document.getElementById('rejected-applications').textContent = rejectedApplications;
                document.getElementById('weekly-applications').textContent = weeklyApplications;
                
                // Setup search and filter
                setupSearchAndFilter();
                
                // Setup pagination
                setupPagination('applications', filteredApplications, renderApplicationsTable, currentApplicationsPage);
                
                // Setup multi-select functionality
                setupApplicationsMultiSelect();
                
            } catch (error) {
                console.error('Error loading applications:', error);
                document.getElementById('applications-table-body').innerHTML = 
                    '<tr><td colspan="7" class="px-6 py-4 text-center text-red-500">Error loading applications: ' + error.message + '</td></tr>';
            }
        }
        
        // Setup applications multi-select functionality
        function setupApplicationsMultiSelect() {
            const selectAllCheckbox = document.getElementById('select-all-applications');
            const applicationCheckboxes = document.querySelectorAll('.application-checkbox');
            const bulkActions = document.getElementById('applications-bulk-actions');
            const selectedCount = document.getElementById('applications-selected-count');
            const deleteSelectedBtn = document.getElementById('delete-selected-applications');
            const clearSelectionBtn = document.getElementById('clear-applications-selection');
            
            // Select all functionality
            if (selectAllCheckbox) {
                selectAllCheckbox.addEventListener('change', function() {
                    applicationCheckboxes.forEach(checkbox => {
                        checkbox.checked = this.checked;
                    });
                    updateApplicationsBulkActions();
                });
            }
            
            // Individual checkbox functionality
            applicationCheckboxes.forEach(checkbox => {
                checkbox.addEventListener('change', function() {
                    updateApplicationsSelectAllState();
                    updateApplicationsBulkActions();
                });
            });
            
            // Delete selected functionality
            if (deleteSelectedBtn) {
                deleteSelectedBtn.addEventListener('click', function() {
                    const selectedApplicationIds = getSelectedApplicationIds();
                    if (selectedApplicationIds.length > 0) {
                        deleteSelectedApplications(selectedApplicationIds);
                    }
                });
            }
            
            // Clear selection functionality
            if (clearSelectionBtn) {
                clearSelectionBtn.addEventListener('click', function() {
                    applicationCheckboxes.forEach(checkbox => {
                        checkbox.checked = false;
                    });
                    if (selectAllCheckbox) {
                        selectAllCheckbox.checked = false;
                    }
                    updateApplicationsBulkActions();
                });
            }
            
            function updateApplicationsSelectAllState() {
                if (selectAllCheckbox) {
                    const checkedBoxes = document.querySelectorAll('.application-checkbox:checked');
                    selectAllCheckbox.checked = checkedBoxes.length === applicationCheckboxes.length;
                    selectAllCheckbox.indeterminate = checkedBoxes.length > 0 && checkedBoxes.length < applicationCheckboxes.length;
                }
            }
            
            function updateApplicationsBulkActions() {
                const selectedApplicationIds = getSelectedApplicationIds();
                if (selectedApplicationIds.length > 0) {
                    bulkActions.classList.remove('hidden');
                    selectedCount.textContent = `${selectedApplicationIds.length} selected`;
                } else {
                    bulkActions.classList.add('hidden');
                }
            }
            
            function getSelectedApplicationIds() {
                const checkedBoxes = document.querySelectorAll('.application-checkbox:checked');
                return Array.from(checkedBoxes).map(checkbox => checkbox.dataset.applicationId);
            }
        }
        
        // Delete selected applications
        async function deleteSelectedApplications(applicationIds) {
            if (!confirm(`Are you sure you want to delete ${applicationIds.length} application(s)? This action cannot be undone.`)) {
                return;
            }
            
            try {
                console.log('Deleting applications:', applicationIds);
                
                // Delete from Supabase applications table
                const { error } = await supabase
                    .from('applications')
                    .delete()
                    .in('id', applicationIds);
                
                if (error) {
                    throw new Error(error.message);
                }
                
                // Show success message
                alert(`Successfully deleted ${applicationIds.length} application(s).`);
                
                // Reload the applications data
                await loadApplicationsData();
                
            } catch (error) {
                console.error('Error deleting applications:', error);
                alert(`Error deleting applications: ${error.message}`);
            }
        }
        
        // Render applications table
        function renderApplicationsTable(applications) {
            const tbody = document.getElementById('applications-table-body');
            if (!tbody) return;

            if (applications.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" class="px-6 py-4 text-center text-gray-500">No applications found</td></tr>';
                return;
            }

            tbody.innerHTML = applications.map(app => `
                <tr>
                    <td class="px-6 py-4 whitespace-nowrap">
                        <input type="checkbox" class="application-checkbox rounded border-gray-300 text-kajopo-blue focus:ring-kajopo-blue" data-application-id="${app.id}">
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap">
                        <div class="text-sm font-medium text-gray-900">${app.full_name || 'N/A'}</div>
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap">
                        <div class="text-sm text-gray-500">${app.email || 'N/A'}</div>
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap">
                        <div class="text-sm text-gray-900">${app.opportunity_title || 'N/A'}</div>
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap">
                        <div class="text-sm text-gray-500">${app.organization || 'N/A'}</div>
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap">
                        <span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full ${
                            app.status === 'approved' ? 'bg-green-100 text-green-800' :
                            app.status === 'rejected' ? 'bg-red-100 text-red-800' :
                            'bg-yellow-100 text-yellow-800'
                        }">
                            ${app.status || 'pending'}
                        </span>
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">
                        ${app.created_at ? new Date(app.created_at).toLocaleDateString() : 'N/A'}
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm font-medium">
                        <button onclick="viewApplication('${app.id}')" class="text-kajopo-blue hover:text-kajopo-purple mr-3">View</button>
                        <button onclick="updateApplicationStatus('${app.id}', 'approved')" class="text-green-600 hover:text-green-900 mr-3">Approve</button>
                        <button onclick="updateApplicationStatus('${app.id}', 'rejected')" class="text-red-600 hover:text-red-900">Reject</button>
                    </td>
                </tr>
            `).join('');
        }
        
        // Load users data
        async function loadUsersData() {
            try {
                console.log('Loading users data...');
                
                const { data: users, error } = await supabase
                    .from('users')
                    .select('*')
                    .order('created_at', { ascending: false });
                
                if (error) {
                    throw new Error(error.message);
                }
                
                const usersList = users || [];
                console.log(`Found ${usersList.length} users`);
                
                // Map database fields to expected camelCase format
                const mappedUsers = usersList.map(user => ({
                    ...user,
                    // Map snake_case to camelCase for compatibility
                    accountType: user.account_type || user.accountType,
                    firstName: user.first_name || user.firstName,
                    lastName: user.last_name || user.lastName,
                    organizationName: user.organization_name || user.organizationName,
                    isverified: user.verified || user.isverified,
                    // Keep both formats for backward compatibility
                    account_type: user.account_type,
                    first_name: user.first_name,
                    last_name: user.last_name,
                    organization_name: user.organization_name,
                    verified: user.verified
                }));
                
                
                // Store in global variables
                allUsers = mappedUsers;
                filteredUsers = [...mappedUsers];
                
                // Calculate stats
                const totalUsers = mappedUsers.length;
                const seekers = mappedUsers.filter(user => user.accountType === 'seeker').length;
                const providers = mappedUsers.filter(user => user.accountType === 'provider').length;
                const admins = mappedUsers.filter(user => user.accountType === 'admin').length;
                const confirmed = mappedUsers.filter(user => user.verified || user.email_confirmed_at).length;
                const pending = totalUsers - confirmed;
                
                // Update stats cards
                document.getElementById('total-users').textContent = totalUsers;
                document.getElementById('seekers').textContent = seekers;
                document.getElementById('providers').textContent = providers;
                document.getElementById('admins').textContent = admins;
                document.getElementById('confirmed').textContent = confirmed;
                document.getElementById('pending').textContent = pending;
                
                // Setup search and filter
                setupSearchAndFilter();
                
                // Setup pagination
                setupPagination('users', filteredUsers, renderUsersTable, currentUsersPage);
                
                // Setup multi-select functionality
                setupMultiSelect();
                
            } catch (error) {
                console.error('Error loading users:', error);
                document.getElementById('users-table-body').innerHTML = 
                    '<tr><td colspan="6" class="px-6 py-4 text-center text-red-500">Error loading users: ' + error.message + '</td></tr>';
            }
        }
        
        // Setup multi-select functionality
        function setupMultiSelect() {
            const selectAllCheckbox = document.getElementById('select-all-users');
            const userCheckboxes = document.querySelectorAll('.user-checkbox');
            const bulkActions = document.getElementById('bulk-actions');
            const selectedCount = document.getElementById('selected-count');
            const deleteSelectedBtn = document.getElementById('delete-selected');
            const clearSelectionBtn = document.getElementById('clear-selection');
            
            // Select all functionality
            if (selectAllCheckbox) {
                selectAllCheckbox.addEventListener('change', function() {
                    userCheckboxes.forEach(checkbox => {
                        checkbox.checked = this.checked;
                    });
                    updateBulkActions();
                });
            }
            
            // Individual checkbox functionality
            userCheckboxes.forEach(checkbox => {
                checkbox.addEventListener('change', function() {
                    updateSelectAllState();
                    updateBulkActions();
                });
            });
            
            // Delete selected functionality
            if (deleteSelectedBtn) {
                deleteSelectedBtn.addEventListener('click', function() {
                    const selectedUserIds = getSelectedUserIds();
                    if (selectedUserIds.length > 0) {
                        deleteSelectedUsers(selectedUserIds);
                    }
                });
            }
            
            // Clear selection functionality
            if (clearSelectionBtn) {
                clearSelectionBtn.addEventListener('click', function() {
                    userCheckboxes.forEach(checkbox => {
                        checkbox.checked = false;
                    });
                    if (selectAllCheckbox) {
                        selectAllCheckbox.checked = false;
                    }
                    updateBulkActions();
                });
            }
            
            function updateSelectAllState() {
                if (selectAllCheckbox) {
                    const checkedBoxes = document.querySelectorAll('.user-checkbox:checked');
                    selectAllCheckbox.checked = checkedBoxes.length === userCheckboxes.length;
                    selectAllCheckbox.indeterminate = checkedBoxes.length > 0 && checkedBoxes.length < userCheckboxes.length;
                }
            }
            
            function updateBulkActions() {
                const selectedUserIds = getSelectedUserIds();
                if (selectedUserIds.length > 0) {
                    bulkActions.classList.remove('hidden');
                    selectedCount.textContent = `${selectedUserIds.length} selected`;
                } else {
                    bulkActions.classList.add('hidden');
                }
            }
            
            function getSelectedUserIds() {
                const checkedBoxes = document.querySelectorAll('.user-checkbox:checked');
                return Array.from(checkedBoxes).map(checkbox => checkbox.dataset.userId);
            }
        }
        
        // Delete selected users
        async function deleteSelectedUsers(userIds) {
            if (!confirm(`Are you sure you want to delete ${userIds.length} user(s)? This action cannot be undone.`)) {
                return;
            }
            
            try {
                console.log('Deleting users:', userIds);
                
                // Delete from Supabase users table
                const { error } = await supabase
                    .from('users')
                    .delete()
                    .in('id', userIds);
                
                if (error) {
                    throw new Error(error.message);
                }
                
                // Also delete from Supabase Auth (if needed)
                for (const userId of userIds) {
                    try {
                        const { error: authError } = await supabase.auth.admin.deleteUser(userId);
                        if (authError) {
                            console.warn(`Could not delete user ${userId} from auth:`, authError.message);
                        }
                    } catch (authError) {
                        console.warn(`Could not delete user ${userId} from auth:`, authError.message);
                    }
                }
                
                // Show success message
                alert(`Successfully deleted ${userIds.length} user(s).`);
                
                // Reload the users data
                await loadUsersData();
                
            } catch (error) {
                console.error('Error deleting users:', error);
                alert(`Error deleting users: ${error.message}`);
            }
        }
        
        // Render users table
        function renderUsersTable(users) {
            const tbody = document.getElementById('users-table-body');
            if (!tbody) return;

            if (users.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" class="px-6 py-4 text-center text-gray-500">No users found</td></tr>';
                return;
            }

            tbody.innerHTML = users.map(user => `
                <tr>
                    <td class="px-6 py-4 whitespace-nowrap">
                        <input type="checkbox" class="user-checkbox rounded border-gray-300 text-kajopo-blue focus:ring-kajopo-blue" data-user-id="${user.id}">
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap">
                        <div class="text-sm font-medium text-gray-900">${user.accountType === 'provider' ? (user.organization_name || user.organizationName || '') : (user.firstName || '') + ' ' + (user.lastName || '')}</div>
                        <div class="text-sm text-gray-500">${user.email}</div>
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap">

        // Load opportunities data
        async function loadOpportunitiesData() {
            try {
                console.log('Loading opportunities data...');
                
                const { data: opportunities, error } = await supabase
                    .from('opportunities')
                    .select('*')
                    .order('created_at', { ascending: false });
                
                if (error) {
                    throw new Error(error.message);
                }
                
                const opps = opportunities || [];
                console.log(`Found ${opps.length} opportunities`);
                
                // Store in global variables
                allOpportunities = opps;
                filteredOpportunities = [...opps];
                
                // Calculate stats
                const totalOpportunities = opps.length;
                const paidOpportunities = opps.filter(opp => opp.type === 'paid').length;
                const volunteerOpportunities = opps.filter(opp => opp.type === 'volunteer').length;
                const activeOpportunities = opps.filter(opp => opp.status === 'active' || !opp.status).length;
                const thisWeek = opps.filter(opp => {
                    const oppDate = new Date(opp.created_at);
                    const oneWeekAgo = new Date();
                    oneWeekAgo.setDate(oneWeekAgo.getDate() - 7);
                    return oppDate >= oneWeekAgo;
                }).length;
                
                // Update stats cards
                document.getElementById('total-opportunities').textContent = totalOpportunities;
                document.getElementById('paid-opportunities').textContent = paidOpportunities;
                document.getElementById('volunteer-opportunities').textContent = volunteerOpportunities;
                document.getElementById('active-opportunities').textContent = activeOpportunities;
                document.getElementById('weekly-opportunities').textContent = thisWeek;
                
                // Setup search and filter
                setupSearchAndFilter();
                
                // Setup pagination
                setupPagination('opportunities', filteredOpportunities, renderOpportunitiesTable, currentOpportunitiesPage);
                
                // Setup multi-select functionality
                setupOpportunitiesMultiSelect();
                
            } catch (error) {
                console.error('Error loading opportunities:', error);
                document.getElementById('opportunities-table-body').innerHTML = 
                    '<tr><td colspan="6" class="px-6 py-4 text-center text-red-500">Error loading opportunities: ' + error.message + '</td></tr>';
            }
        }
        
        // Setup opportunities multi-select functionality
        function setupOpportunitiesMultiSelect() {
            const selectAllCheckbox = document.getElementById('select-all-opportunities');
            const opportunityCheckboxes = document.querySelectorAll('.opportunity-checkbox');
            const bulkActions = document.getElementById('opportunities-bulk-actions');
            const selectedCount = document.getElementById('opportunities-selected-count');
            const deleteSelectedBtn = document.getElementById('delete-selected-opportunities');
            const clearSelectionBtn = document.getElementById('clear-opportunities-selection');
            
            // Select all functionality
            if (selectAllCheckbox) {
                selectAllCheckbox.addEventListener('change', function() {
                    opportunityCheckboxes.forEach(checkbox => {
                        checkbox.checked = this.checked;
                    });
                    updateOpportunitiesBulkActions();
                });
            }
            
            // Individual checkbox functionality
            opportunityCheckboxes.forEach(checkbox => {
                checkbox.addEventListener('change', function() {
                    updateOpportunitiesSelectAllState();
                    updateOpportunitiesBulkActions();
                });
            });
            
            // Delete selected functionality
            if (deleteSelectedBtn) {
                deleteSelectedBtn.addEventListener('click', function() {
                    const selectedOpportunityIds = getSelectedOpportunityIds();
                    if (selectedOpportunityIds.length > 0) {
                        deleteSelectedOpportunities(selectedOpportunityIds);
                    }
                });
            }
            
            // Clear selection functionality
            if (clearSelectionBtn) {
                clearSelectionBtn.addEventListener('click', function() {
                    opportunityCheckboxes.forEach(checkbox => {
                        checkbox.checked = false;
                    });
                    if (selectAllCheckbox) {
                        selectAllCheckbox.checked = false;
                    }
                    updateOpportunitiesBulkActions();
                });
            }
            
            function updateOpportunitiesSelectAllState() {
                if (selectAllCheckbox) {
                    const checkedBoxes = document.querySelectorAll('.opportunity-checkbox:checked');
                    selectAllCheckbox.checked = checkedBoxes.length === opportunityCheckboxes.length;
                    selectAllCheckbox.indeterminate = checkedBoxes.length > 0 && checkedBoxes.length < opportunityCheckboxes.length;
                }
            }
            
            function updateOpportunitiesBulkActions() {
                const selectedOpportunityIds = getSelectedOpportunityIds();
                if (selectedOpportunityIds.length > 0) {
                    bulkActions.classList.remove('hidden');
                    selectedCount.textContent = `${selectedOpportunityIds.length} selected`;
                } else {
                    bulkActions.classList.add('hidden');
                }
            }
            
            function getSelectedOpportunityIds() {
                const checkedBoxes = document.querySelectorAll('.opportunity-checkbox:checked');
                return Array.from(checkedBoxes).map(checkbox => checkbox.dataset.opportunityId);
            }
        }
        
        // Delete selected opportunities
        async function deleteSelectedOpportunities(opportunityIds) {
            if (!confirm(`Are you sure you want to delete ${opportunityIds.length} opportunity(ies)? This action cannot be undone.`)) {
                return;
            }
            
            try {
                console.log('Deleting opportunities:', opportunityIds);
                
                // Delete from Supabase opportunities table
                const { error } = await supabase
                    .from('opportunities')
                    .delete()
                    .in('id', opportunityIds);
                
                if (error) {
                    throw new Error(error.message);
                }
                
                // Show success message
                alert(`Successfully deleted ${opportunityIds.length} opportunity(ies).`);
                
                // Reload the opportunities data
                await loadOpportunitiesData();
                
            } catch (error) {
                console.error('Error deleting opportunities:', error);
                alert(`Error deleting opportunities: ${error.message}`);
            }
        }

        async function saveUserStatus(userId) {
            try {
                const select = document.getElementById(`user-status-${userId}`);
                const newStatus = select.value;
                
                let updateData = {
                    updated_at: new Date().toISOString()
                };
                
                // Handle different status values
                switch (newStatus) {
                    case 'confirmed':
                        updateData.verified = true;
                        break;
                    case 'pending':
                        updateData.verified = false;
                        break;
                    case 'suspended':
                        updateData.verified = false;
                        // Note: We don't have a suspended status column, so we just set verified to false
                        break;
                    default:
                        throw new Error('Invalid status value');

                // Update user status
                const { error: updateError } = await supabase
                    .from('users')
                    .update(updateData)
                    .eq('id', userId);
                
                if (updateError) {
                    throw new Error(updateError.message);
                }
                
                // Update the original value
                select.setAttribute('data-original', newStatus);
                
                // Hide Save/Cancel buttons

                loadOpportunitiesView();
            } else {
                document.getElementById('content').innerHTML = `
                    <div class="text-center">
                        <h2 class="text-2xl font-bold text-gray-900 mb-4">${view.charAt(0).toUpperCase() + view.slice(1)} Management</h2>
                        <p class="text-gray-600">This section is coming soon!</p>
                    </div>
                `;
            }
        }
        
        // Theme toggle
        function setupThemeToggle() {
            const themeToggleBtn = document.getElementById('themeToggleBtn');
            const sunIcon = document.getElementById('sunIcon');
            const moonIcon = document.getElementById('moonIcon');
            
            // Get current theme
            const currentTheme = localStorage.getItem('theme') || 'light';
            document.documentElement.setAttribute('data-theme', currentTheme);
            
            if (currentTheme === 'dark') {
                sunIcon.classList.add('hidden');
                moonIcon.classList.remove('hidden');
            }
            
            themeToggleBtn.addEventListener('click', () => {
                const currentTheme = document.documentElement.getAttribute('data-theme');
                const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
                
                document.documentElement.setAttribute('data-theme', newTheme);
                localStorage.setItem('theme', newTheme);
                
                if (newTheme === 'dark') {
                    sunIcon.classList.add('hidden');
                    moonIcon.classList.remove('hidden');
                } else {
                    sunIcon.classList.remove('hidden');
                    moonIcon.classList.add('hidden');
                }
            });
        }
        
        // Logout
        function setupLogout() {
            document.getElementById('logoutBtn').addEventListener('click', () => {
                if (window.unifiedAuth) {
                    window.unifiedAuth.logout();
                } else {
                    localStorage.removeItem('kajopo_session');
                    localStorage.removeItem('kajopo_current_user');
                    localStorage.removeItem('kajopo_user');
                }
                window.location.href = 'index.html';
            });
        }

        // Setup user menu dropdown functionality
        function setupUserMenuListeners() {
            const userMenuBtn = document.getElementById('userMenuBtn');
            const userDropdown = document.getElementById('userDropdown');
            
            if (userMenuBtn && userDropdown) {
                userMenuBtn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    userDropdown.classList.toggle('hidden');
                });
                
                // Close dropdown when clicking outside
                document.addEventListener('click', function(event) {
                    if (!userMenuBtn.contains(event.target) && !userDropdown.contains(event.target)) {
                        userDropdown.classList.add('hidden');
                    }
                });
            }
        }

        // Navigate to user profile
        function goToProfile() {
            const currentUser = window.unifiedAuth ? window.unifiedAuth.getCurrentUser() : null;
            
            if (currentUser) {
                const isSeeker = currentUser.accountType === 'seeker' || currentUser.role === 'I Need Help';
                
                if (isSeeker) {
                    window.location.href = 'seeker-profile.html';
                } else {
                    window.location.href = 'provider-profile.html';
                }
            } else {
                window.location.href = 'signin-form.html';
            }
        }
        
        // Global variables for search and sort
        let allUsers = [];
        let filteredUsers = [];
        let allOpportunities = [];
        let filteredOpportunities = [];
        let allApplications = [];
        let filteredApplications = [];
        let currentSortColumn = null;
        let currentSortDirection = 'asc';

        // Search and filter functions
        function setupSearchAndFilter() {
            // Users search and filter
            const userSearch = document.getElementById('user-search');
            const userStatusFilter = document.getElementById('user-status-filter');
            const userTypeFilter = document.getElementById('user-type-filter');

            if (userSearch) {
                userSearch.addEventListener('input', () => filterUsers());
            }
            if (userStatusFilter) {
                userStatusFilter.addEventListener('change', () => filterUsers());
            }
            if (userTypeFilter) {
                userTypeFilter.addEventListener('change', () => filterUsers());
            }

            // Opportunities search and filter
            const opportunitySearch = document.getElementById('opportunity-search');
            const opportunityStatusFilter = document.getElementById('opportunity-status-filter');
            const opportunityTypeFilter = document.getElementById('opportunity-type-filter');

            if (opportunitySearch) {
                opportunitySearch.addEventListener('input', () => filterOpportunities());
            }
            if (opportunityStatusFilter) {
                opportunityStatusFilter.addEventListener('change', () => filterOpportunities());
            }
            if (opportunityTypeFilter) {
                opportunityTypeFilter.addEventListener('change', () => filterOpportunities());
            }

            // Applications search and filter
            const applicationSearch = document.getElementById('application-search');
            const applicationStatusFilter = document.getElementById('application-status-filter');
            const applicationTypeFilter = document.getElementById('application-type-filter');

            if (applicationSearch) {
                applicationSearch.addEventListener('input', () => filterApplications());
            }
            if (applicationStatusFilter) {
                applicationStatusFilter.addEventListener('change', () => filterApplications());
            }
            if (applicationTypeFilter) {
                applicationTypeFilter.addEventListener('change', () => filterApplications());
            }

            // Sort functionality
            document.querySelectorAll('[data-sort]').forEach(header => {
                header.addEventListener('click', (e) => {
                    const column = e.currentTarget.dataset.sort;
                    
                    if (currentView === 'users') {
                        sortUsers(column);
                    } else if (currentView === 'opportunities') {
                        sortOpportunities(column);
                    } else if (currentView === 'applications') {
                        sortApplications(column);
                    }
                });
            });
        }

        function filterUsers() {
            const searchTerm = document.getElementById('user-search')?.value.toLowerCase() || '';
            const statusFilter = document.getElementById('user-status-filter')?.value || 'all';
            const typeFilter = document.getElementById('user-type-filter')?.value || 'all';

            filteredUsers = allUsers.filter(user => {
                const matchesSearch = !searchTerm || 
                    (user.firstName && user.firstName.toLowerCase().includes(searchTerm)) ||
                    (user.lastName && user.lastName.toLowerCase().includes(searchTerm)) ||
                    (user.email && user.email.toLowerCase().includes(searchTerm));

                const matchesStatus = statusFilter === 'all' || 
                    (statusFilter === 'confirmed' && (user.verified || user.email_confirmed_at)) ||
                    (statusFilter === 'pending' && !user.verified && !user.email_confirmed_at);

                const matchesType = typeFilter === 'all' || user.accountType === typeFilter;

                return matchesSearch && matchesStatus && matchesType;
            });

            renderUsersTable(filteredUsers);
        }

        function filterOpportunities() {
            const searchTerm = document.getElementById('opportunity-search')?.value.toLowerCase() || '';
            const statusFilter = document.getElementById('opportunity-status-filter')?.value || 'all';
            const typeFilter = document.getElementById('opportunity-type-filter')?.value || 'all';

            filteredOpportunities = allOpportunities.filter(opp => {
                const matchesSearch = !searchTerm || 
                    (opp.title && opp.title.toLowerCase().includes(searchTerm)) ||
                    (opp.organization && opp.organization.toLowerCase().includes(searchTerm));

                const matchesStatus = statusFilter === 'all' || opp.status === statusFilter;

                const matchesType = typeFilter === 'all' || opp.type === typeFilter;

                return matchesSearch && matchesStatus && matchesType;
            });

            renderOpportunitiesTable(filteredOpportunities);
        }

        function filterApplications() {
            const searchTerm = document.getElementById('application-search')?.value.toLowerCase() || '';
            const statusFilter = document.getElementById('application-status-filter')?.value || 'all';
            const typeFilter = document.getElementById('application-type-filter')?.value || 'all';

            filteredApplications = allApplications.filter(app => {
                const matchesSearch = !searchTerm || 
                    (app.full_name && app.full_name.toLowerCase().includes(searchTerm)) ||
                    (app.email && app.email.toLowerCase().includes(searchTerm)) ||
                    (app.opportunity_title && app.opportunity_title.toLowerCase().includes(searchTerm));

                const matchesStatus = statusFilter === 'all' || app.status === statusFilter;

                const matchesType = typeFilter === 'all' || app.opportunity_type === typeFilter;

                return matchesSearch && matchesStatus && matchesType;
            });

            renderApplicationsTable(filteredApplications);
        }

        function sortUsers(column) {
            if (currentSortColumn === column) {
                currentSortDirection = currentSortDirection === 'asc' ? 'desc' : 'asc';
            } else {
                currentSortColumn = column;
                currentSortDirection = 'asc';
            }

            // Update sort icons
            updateSortIcons(column, currentSortDirection);

            filteredUsers.sort((a, b) => {
                let aValue, bValue;

                switch (column) {
                    case 'name':
                        // For providers, use organization name; for seekers, use first/last name
                        aValue = a.accountType === 'provider' ? 
                            (a.organization_name || a.organizationName || '') : 
                            `${a.firstName || ''} ${a.lastName || ''}`.trim();
                        bValue = b.accountType === 'provider' ? 
                            (b.organization_name || b.organizationName || '') : 
                            `${b.firstName || ''} ${b.lastName || ''}`.trim();
                        break;
                    case 'accountType':
                        aValue = a.accountType || '';
                        bValue = b.accountType || '';
                        break;
                    case 'status':
                        aValue = a.verified || a.email_confirmed_at ? 'confirmed' : 'pending';
                        bValue = b.verified || b.email_confirmed_at ? 'confirmed' : 'pending';
                        break;
                    case 'created_at':
                        aValue = new Date(a.created_at || 0);
                        bValue = new Date(b.created_at || 0);
                        break;
                    default:
                        return 0;
                }

                if (aValue < bValue) return currentSortDirection === 'asc' ? -1 : 1;
                if (aValue > bValue) return currentSortDirection === 'asc' ? 1 : -1;
                return 0;
            });

            renderUsersTable(filteredUsers);
        }

        // Update sort icons to show current sort direction
        function updateSortIcons(column, direction) {
            // Reset all sort icons
            document.querySelectorAll('.sort-icon').forEach(icon => {
                icon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16V4m0 0L3 8m4-4l4 4m6 0v12m0 0l4-4m-4 4l-4-4"></path>';
            });
            
            // Update the current column's sort icon
            const currentHeader = document.querySelector(`[data-sort="${column}"] .sort-icon`);
            if (currentHeader) {
                if (direction === 'asc') {
                    currentHeader.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 14l3-3 3 3m-6 0l3 3 3-3"></path>';
                } else {
                    currentHeader.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 10l3 3 3-3m-6 0l3-3 3 3"></path>';
                }
            }
        }

        function sortOpportunities(column) {
            if (currentSortColumn === column) {
                currentSortDirection = currentSortDirection === 'asc' ? 'desc' : 'asc';
            } else {
                currentSortColumn = column;
                currentSortDirection = 'asc';
            }

            filteredOpportunities.sort((a, b) => {
                let aValue, bValue;

                switch (column) {
                    case 'title':
                        aValue = a.title || '';
                        bValue = b.title || '';
                        break;
                    case 'type':
                        aValue = a.type || '';
                        bValue = b.type || '';
                        break;
                    case 'category':
                        aValue = a.category || '';
                        bValue = b.category || '';
                        break;
                    case 'status':
                        aValue = a.status || '';
                        bValue = b.status || '';
                        break;
                    case 'created_at':
                        aValue = new Date(a.created_at || 0);
                        bValue = new Date(b.created_at || 0);
                        break;
                    default:
                        return 0;
                }

                if (aValue < bValue) return currentSortDirection === 'asc' ? -1 : 1;
                if (aValue > bValue) return currentSortDirection === 'asc' ? 1 : -1;
                return 0;
            });

            renderOpportunitiesTable(filteredOpportunities);
        }

        function sortApplications(column) {
            if (currentSortColumn === column) {
                currentSortDirection = currentSortDirection === 'asc' ? 'desc' : 'asc';
            } else {
                currentSortColumn = column;
                currentSortDirection = 'asc';
            }

            filteredApplications.sort((a, b) => {
                let aValue, bValue;

                switch (column) {
                    case 'full_name':
                        aValue = a.full_name || '';
                        bValue = b.full_name || '';
                        break;
                    case 'email':
                        aValue = a.email || '';
                        bValue = b.email || '';
                        break;
                    case 'status':
                        aValue = a.status || '';
                        bValue = b.status || '';
                        break;
                    case 'created_at':
                        aValue = new Date(a.created_at || 0);
                        bValue = new Date(b.created_at || 0);
                        break;
                    default:
                        return 0;
                }

                if (aValue < bValue) return currentSortDirection === 'asc' ? -1 : 1;
                if (aValue > bValue) return currentSortDirection === 'asc' ? 1 : -1;
                return 0;
            });

            renderApplicationsTable(filteredApplications);
        }

        // Initialize dashboard
        async function initializeDashboard() {
            try {
                console.log('Starting dashboard initialization...');
                
                // Check authentication
                if (!checkAdminAuth()) {
                    return;
                }
                
                // Initialize Supabase
                const supabaseReady = await initializeSupabase();
                if (!supabaseReady) {
                    throw new Error('Failed to initialize Supabase');
                }
                
                // Setup event listeners
                document.getElementById('applications-nav')?.addEventListener('click', (e) => {
                    e.preventDefault();
                    switchView('applications');
                });
                
                document.getElementById('users-nav')?.addEventListener('click', (e) => {
                    e.preventDefault();
                    switchView('users');
                });
                
                document.getElementById('opportunities-nav')?.addEventListener('click', (e) => {
                    e.preventDefault();
                    switchView('opportunities');
                });
                
                setupThemeToggle();
                setupLogout();
                setupUserMenuListeners();
                
                // Load default view (applications)
                switchView('applications');
                
                console.log('✅ Dashboard initialized successfully');
                
            } catch (error) {
                console.error('❌ Failed to initialize dashboard:', error);
                document.getElementById('content').innerHTML = `
                    <div class="text-center">
                        <h2 class="text-2xl font-bold text-red-600 mb-4">Failed to load dashboard</h2>
                        <p class="text-gray-600 mb-4">Error: ${error.message}</p>
                        <button onclick="location.reload()" class="bg-blue-600 text-white px-4 py-2 rounded-md hover:bg-blue-700">Retry</button>
                    </div>
                `;
            }
        }
        
        // Pagination functionality
        const ITEMS_PER_PAGE = 10;
        let currentUsersPage = 1;
        let currentOpportunitiesPage = 1;
        let currentApplicationsPage = 1;
        
        // Generic pagination setup
        function setupPagination(tableType, data, renderFunction, currentPage) {
            const totalItems = data.length;
            const totalPages = Math.ceil(totalItems / ITEMS_PER_PAGE);
            const startIndex = (currentPage - 1) * ITEMS_PER_PAGE;
            const endIndex = Math.min(startIndex + ITEMS_PER_PAGE, totalItems);
            
            // Update pagination info
            const startElement = document.getElementById(`${tableType}-start`);
            const endElement = document.getElementById(`${tableType}-end`);
            const totalElement = document.getElementById(`${tableType}-total`);
            
            if (startElement) startElement.textContent = startIndex + 1;
            if (endElement) endElement.textContent = endIndex;
            if (totalElement) totalElement.textContent = totalItems;
            
            // Update pagination buttons
            const prevBtn = document.getElementById(`${tableType}-prev`);
            const nextBtn = document.getElementById(`${tableType}-next`);
            
            if (prevBtn) prevBtn.disabled = currentPage === 1;
            if (nextBtn) nextBtn.disabled = currentPage === totalPages;
            
            // Generate page numbers
            const pageNumbersContainer = document.getElementById(`${tableType}-page-numbers`);
            if (pageNumbersContainer) {
                pageNumbersContainer.innerHTML = '';
                
                for (let i = 1; i <= totalPages; i++) {
                    const pageBtn = document.createElement('button');
                    pageBtn.textContent = i;
                    pageBtn.className = `px-3 py-1 text-sm border rounded-md ${
                        i === currentPage 
                            ? 'bg-kajopo-blue text-white border-kajopo-blue' 
                            : 'border-gray-300 hover:bg-gray-50'
                    }`;
                    pageBtn.addEventListener('click', () => {
                        if (tableType === 'users') {
                            currentUsersPage = i;
                            setupPagination('users', allUsers, renderUsersTable, currentUsersPage);
                        } else if (tableType === 'opportunities') {
                            currentOpportunitiesPage = i;
                            setupPagination('opportunities', allOpportunities, renderOpportunitiesTable, currentOpportunitiesPage);
                        } else if (tableType === 'applications') {
                            currentApplicationsPage = i;
                            setupPagination('applications', allApplications, renderApplicationsTable, currentApplicationsPage);
                        }
                    });
                    pageNumbersContainer.appendChild(pageBtn);
                }
            }
            
            // Render current page data
            const pageData = data.slice(startIndex, endIndex);
            renderFunction(pageData);
        }
        
        // Start initialization when DOM is ready
        document.addEventListener('DOMContentLoaded', initializeDashboard);
    </script>
</body>
